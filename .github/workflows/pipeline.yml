name: Pipeline

# Weekly incremental run, plus a manual trigger. A failed job emails repository
# collaborators who have Actions failure notifications on (see Docs/deployment-runbook.md).
on:
  schedule:
    - cron: "23 6 * * 1" # Monday 06:23 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "Only items newer than YYYY-MM-DD, or last. Empty means a full ingest."
        type: string
        default: last
      limit:
        description: Max items per source (empty = no limit)
        type: string
        default: ""
      skip_regression:
        description: Skip the gold-set prompt gate (experiments only)
        type: boolean
        default: false

# Shared with app_store_daily so a manual run cannot overlap the daily ingest.
concurrency:
  group: discovery-pipeline
  cancel-in-progress: false

jobs:
  run-all:
    runs-on: ubuntu-latest
    # Community crawl plus the AI stages. GitHub's job limit is 6 hours.
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTHOR_HASH_SALT: ${{ secrets.AUTHOR_HASH_SALT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SINCE: ${{ github.event_name == 'schedule' && 'last' || inputs.since }}
      LIMIT: ${{ inputs.limit }}
      SKIP_REGRESSION: ${{ github.event_name == 'schedule' && 'false' || inputs.skip_regression }}
    steps:
      - name: Check secrets
        run: |
          for name in DATABASE_URL AUTHOR_HASH_SALT ANTHROPIC_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is not set (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Install Chromium (Help Community crawler)
        run: uv run playwright install --with-deps chromium
      - run: uv run discovery init-db
      - name: Run the pipeline
        run: |
          args=()
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          [ "$SKIP_REGRESSION" = "true" ] && args+=(--skip-regression)
          uv run discovery run-all "${args[@]}"
      - name: Cost report
        if: always()
        run: |
          if [ -f eval/cost_report.md ]; then
            cat eval/cost_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Data quality summary
        if: always()
        run: |
          uv run discovery quality --out quality.md
          cat quality.md >> "$GITHUB_STEP_SUMMARY"
      - name: Recent runs
        if: always()
        run: uv run discovery runs --limit 15
      - name: Publish check failed
        if: failure()
        run: echo "::error::The run was not published. The dashboard still shows the previous run. See Data Quality."
