# Pipeline settings. Secrets (GROQ_API_KEY, DATABASE_URL) never go here; see .env.example.

sources:
  play_store:
    app_id: com.google.android.apps.photos
    lang: en
    countries: [in, us, gb, ca, au]
    max_reviews_per_country: 20000
    requests_per_second: 1
  app_store:
    app_id: "962194608"
    countries: [us, gb, in, ca, au, nz, ie, sg]
    pages: 10
    playwright_fallback: false
  google_sheet:
    sheet_id: 1lrAFUCIkTOCN9uje8u_nlxshmWO8yKe3ygSAlwRW28M
    tabs: auto
    column_map: auto
    default_platform: Reddit
  google_community:
    list_url: "https://support.google.com/photos/threads?hl=en&thread_filter=(category:photos_restore)"
    max_threads: 3000
    seconds_between_pages: 2.5
    include_replies: true

prep:
  languages: [en]
  min_words: 4
  short_text_words: 12
  near_dup_jaccard: 0.85

relevance:
  semantic_margin_threshold: 0.05
  audit_sample_rate: 0.05

llm:
  provider: groq
  # Llama 3.1 8B / 3.3 70B became Enterprise-only on Groq; GPT-OSS models are the
  # publicly available production models and support strict JSON Schema output.
  # Any model change must pass the gold-set regression check before a real run.
  small_model: openai/gpt-oss-20b
  large_model: openai/gpt-oss-120b
  structured_output: json_schema      # json_schema | json_object
  strict_schema: true                 # strict: true = constrained decoding (GPT-OSS supports it)
  reasoning_effort: low               # GPT-OSS only: low | medium | high; null to omit
  temperature: 0
  max_output_tokens: 2048
  escalate_below_confidence: 0.6
  max_input_chars: 6000
  max_attempts: 5                     # network / 429 / 5xx retries per call
  max_retry_wait_seconds: 120         # a longer retry-after means a daily limit is exhausted: stop cleanly
  max_cost_usd_per_run: 5.0           # budget ceiling; the run stops if exceeded
  max_concurrency: 2
  # Per-model limits (Groq enforces them per model). Confirmed 2026-10-01 from the account's
  # x-ratelimit-* headers: free tier, both models 30 RPM, 1K RPD, 8K TPM, 200K TPD. Values
  # below keep ~5% headroom. TPM is the binding limit (~850 tokens/call = ~9 calls/min), and
  # 1K RPD caps a day at ~1,000 calls. On the Developer plan (1K RPM, 250K TPM) raise these
  # and max_concurrency.
  rate_limits:
    default:
      requests_per_minute: 28
      tokens_per_minute: 7500
    openai/gpt-oss-20b:
      requests_per_minute: 28
      tokens_per_minute: 7500
    openai/gpt-oss-120b:
      requests_per_minute: 28
      tokens_per_minute: 7500
  # USD per 1M tokens, from https://console.groq.com/docs/models (verify on change).
  pricing:
    openai/gpt-oss-20b: { input: 0.075, output: 0.30 }
    openai/gpt-oss-120b: { input: 0.15, output: 0.60 }
  use_batch_api_for_backfill: true

database:
  url_env: DATABASE_URL               # Postgres when deployed
  default_url: sqlite:///data/discovery.db

clustering:
  embedding_model: BAAI/bge-small-en-v1.5
  umap: { n_components: 10, n_neighbors: 15, metric: cosine }
  hdbscan: { min_cluster_size: 10 }

scoring:
  low_evidence_min_items: 10
  low_evidence_min_quality: 2.5
