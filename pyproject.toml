[project]
name = "discovery"
version = "0.1.0"
description = "AI-powered discovery engine for vaguely remembered photo retrieval (Google Photos, Phase 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "google-play-scraper>=1.2.7",
    "groq>=0.30",
    "httpx>=0.27",
    "playwright>=1.47",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "tenacity>=8.2",
    "typer>=0.12",
]

[project.scripts]
discovery = "discovery.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # Typer uses function calls in argument defaults
