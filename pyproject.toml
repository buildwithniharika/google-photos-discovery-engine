[project]
name = "discovery"
version = "0.1.0"
description = "AI-powered discovery engine for vaguely remembered photo retrieval (Google Photos, Phase 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "beautifulsoup4>=4.12",
    "google-auth>=2.35",
    "google-play-scraper>=1.2.7",
    "groq>=0.30",
    "gspread>=6.1",
    "httpx>=0.27",
    "langdetect>=1.0.9",
    "numpy>=2.4.6",
    "playwright>=1.47",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14.6",
    "reportlab>=4.2",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0",
    "tenacity>=8.2",
    "typer>=0.12",
    "umap-learn>=0.5.7",
]

[project.scripts]
discovery = "discovery.cli:app"

[dependency-groups]
dev = [
    "pandas>=2.2",
    "plotly>=5.24",
    "pytest>=8.0",
    "ruff>=0.6",
    "streamlit>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # Typer uses function calls in argument defaults

[tool.ruff.lint.per-file-ignores]
"dashboard/app.py" = ["E402"]
"dashboard/pages/*.py" = ["E402"]
